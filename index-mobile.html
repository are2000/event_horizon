<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soul Core Mobile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="loading-screen">
        <div class="loading-core"><div class="core-glow"></div><div class="core-inner"></div></div>
        <h1 class="loading-title">SOUL CORE</h1>
        <p class="loading-subtitle">MOBILE</p>
        <div class="loading-bar"><div class="loading-progress" id="loading-progress" style="width:0%"></div></div>
        <p class="loading-text">تحميل...</p>
    </div>
    <script>
        setTimeout(() => {
            const ls = document.getElementById('loading-screen');
            if (ls) { ls.classList.add('hidden'); setTimeout(() => ls.style.display='none', 500); }
        }, 3000);
    </script>
    <script src="bundle-mobile.js"></script>
</body>
</html>
