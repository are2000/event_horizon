<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soul Core: The Great Decay - Mobile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="orientation-warning">
            <div class="warning-content">
                <h2>يرجى تدوير الجهاز</h2>
                <p>اللعبة مصممة للوضع العمودي Portrait</p>
            </div>
        </div>
    </div>
    
    <div id="loading-screen">
        <div class="loading-core">
            <div class="core-glow"></div>
            <div class="core-inner"></div>
        </div>
        <h1 class="loading-title">SOUL CORE</h1>
        <p class="loading-subtitle">THE GREAT DECAY</p>
        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress" style="width:0%"></div>
        </div>
        <p class="loading-text" id="loading-text">تحميل النواة... 0%</p>
    </div>

    <script>
        // Simple loading progress simulation
        let progress = 0;
        const progressBar = document.getElementById('loading-progress');
        const loadingText = document.getElementById('loading-text');
        const interval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress > 95) progress = 95;
            progressBar.style.width = progress + '%';
            loadingText.textContent = 'تحميل النواة... ' + Math.floor(progress) + '%';
        }, 200);

        window.addEventListener('error', (e) => {
            console.error(e);
            const ls = document.getElementById('loading-screen');
            ls.innerHTML = '<div style="color:#ff4444; text-align:center; padding:20px;"><h2>خطأ</h2><p>' + e.message + '</p><button onclick="location.reload()" style="padding:10px 20px; background:#00ffff; border:none; margin-top:10px;">إعادة تحميل</button></div>';
        });
    </script>

    <!-- Bundled game - no ESM, no CORS issues -->
    <script src="bundle.js"></script>

    <script>
        // Hide loading when game starts
        window.addEventListener('load', () => {
            clearInterval(interval);
            progressBar.style.width = '100%';
            loadingText.textContent = 'جاهز! / Ready!';
        });
    </script>
</body>
</html>
