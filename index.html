<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soul Core: The Great Decay</title>
    <link rel="stylesheet" href="style.css">
    <!-- Phaser UMD - more reliable than ESM importmap for preview -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
        // Fallback CDN if first fails
        if (typeof Phaser === 'undefined') {
            document.write('<script src="https://unpkg.com/phaser@3.80.1/dist/phaser.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="orientation-warning">
            <div class="warning-content">
                <h2>يرجى تدوير الجهاز</h2>
                <p>اللعبة مصممة للوضع العمودي Portrait</p>
                <h2>Please rotate device</h2>
                <p>Game designed for Portrait mode</p>
            </div>
        </div>
    </div>
    
    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loading-core">
            <div class="core-glow"></div>
            <div class="core-inner"></div>
        </div>
        <h1 class="loading-title">SOUL CORE</h1>
        <p class="loading-subtitle">THE GREAT DECAY</p>
        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-text" id="loading-text">تحميل النواة...</p>
        <p id="debug-text" style="color:#ff6666; font-size:10px; margin-top:10px; max-width:300px; text-align:center;"></p>
    </div>

    <!-- Error overlay -->
    <div id="error-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10001; color:white; padding:20px; font-family:monospace; overflow:auto;">
        <h2 style="color:#ff4444;">خطأ / Error</h2>
        <pre id="error-text" style="white-space:pre-wrap; font-size:12px;"></pre>
        <button onclick="document.getElementById('error-overlay').style.display='none'" style="margin-top:20px; padding:10px 20px; background:#ff4444; color:white; border:none; cursor:pointer;">إغلاق / Close</button>
        <button onclick="location.reload()" style="margin-top:20px; margin-left:10px; padding:10px 20px; background:#00ffff; color:black; border:none; cursor:pointer;">إعادة تحميل / Reload</button>
    </div>

    <script>
        // Debug helper
        window.showError = function(msg) {
            const overlay = document.getElementById('error-overlay');
            const text = document.getElementById('error-text');
            text.textContent += msg + '\n';
            overlay.style.display = 'block';
        };

        window.addEventListener('error', (e) => {
            window.showError('JS Error: ' + e.message + '\n' + e.filename + ':' + e.lineno);
        });

        window.addEventListener('unhandledrejection', (e) => {
            window.showError('Promise Rejection: ' + e.reason);
        });

        // Check Phaser loaded
        setTimeout(() => {
            if (typeof Phaser === 'undefined') {
                document.getElementById('debug-text').textContent = 'فشل تحميل Phaser من CDN، جاري المحاولة... / Failed to load Phaser, retrying...';
                window.showError('Phaser not loaded from CDN. Check internet connection. Trying fallback...');
                // Try alternative CDN
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js';
                script.onload = () => {
                    console.log('Phaser loaded from fallback CDN');
                    document.getElementById('debug-text').textContent = 'تم تحميل Phaser / Phaser loaded, starting...';
                };
                script.onerror = () => {
                    window.showError('All CDNs failed. Please check internet. / فشل كل الشبكات.');
                };
                document.head.appendChild(script);
            } else {
                console.log('Phaser version:', Phaser.VERSION);
                document.getElementById('debug-text').textContent = 'Phaser ' + Phaser.VERSION + ' loaded ✓';
            }
        }, 1000);

        // Auto-hide loading after 15 sec if stuck
        setTimeout(() => {
            const ls = document.getElementById('loading-screen');
            if (ls && ls.style.display !== 'none' && !ls.classList.contains('hidden')) {
                document.getElementById('debug-text').textContent += ' | تحميل بطيء... / Slow loading, check console';
            }
        }, 8000);
    </script>

    <script type="module">
        // Wait for Phaser UMD to load, then import game
        // We patch the import to use global Phaser
        async function startGame() {
            // Wait for Phaser global
            let attempts = 0;
            while (typeof Phaser === 'undefined' && attempts < 50) {
                await new Promise(r => setTimeout(r, 200));
                attempts++;
            }
            
            if (typeof Phaser === 'undefined') {
                window.showError('Phaser still not loaded after waiting. / لم يتم تحميل Phaser');
                return;
            }

            // Make Phaser available as ESM import via shim
            // Our modules import from 'phaser', we need to provide a shim
            // Create a blob URL that exports global Phaser
            const phaserShim = `
                const Phaser = window.Phaser;
                export default Phaser;
                export const Scene = Phaser.Scene;
                export const Game = Phaser.Game;
                export const AUTO = Phaser.AUTO;
            `;
            const blob = new Blob([phaserShim], { type: 'text/javascript' });
            const shimUrl = URL.createObjectURL(blob);
            
            // Override importmap dynamically by intercepting?
            // Instead, we will load main.js which now checks for global Phaser first
            try {
                const mainModule = await import('./src/main-umd.js');
                console.log('Game started via main-umd.js');
            } catch (e) {
                console.error('Failed to load main-umd.js, trying main.js', e);
                window.showError('Failed main-umd: ' + e.message);
                try {
                    await import('./src/main.js');
                } catch (e2) {
                    window.showError('Failed main.js: ' + e2.message + '\\n' + e2.stack);
                }
            }
        }

        // Start after a short delay to ensure Phaser UMD is evaluated
        setTimeout(startGame, 500);
    </script>
</body>
</html>
