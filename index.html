<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Soul Core: The Great Decay</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="loading-screen">
        <div class="loading-core"><div class="core-glow"></div><div class="core-inner"></div></div>
        <h1 class="loading-title">SOUL CORE</h1>
        <p class="loading-subtitle">THE GREAT DECAY</p>
        <div class="loading-bar"><div class="loading-progress" id="loading-progress" style="width:0%"></div></div>
        <p class="loading-text" id="loading-text">تحميل النواة...</p>
        <p id="loading-debug" style="color:#00ff88; font-size:10px; margin-top:10px;"></p>
        <button id="skip-loading" style="margin-top:20px; padding:10px 20px; background:#00ffff; color:#000; border:none; border-radius:5px; font-weight:bold; display:none;">تخطي / Skip → ابدأ اللعب</button>
    </div>

    <script>
        // Auto-hide loading screen after max 4 seconds even if game fails - show skip button
        const loadingScreen = document.getElementById('loading-screen');
        const progressBar = document.getElementById('loading-progress');
        const loadingText = document.getElementById('loading-text');
        const debugText = document.getElementById('loading-debug');
        const skipBtn = document.getElementById('skip-loading');
        
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += Math.random() * 15 + 5;
            if (progress > 85) progress = 85;
            progressBar.style.width = progress + '%';
            loadingText.textContent = 'تحميل النواة... ' + Math.floor(progress) + '%';
        }, 400);

        // Debug Phaser load
        setTimeout(() => {
            if (typeof Phaser === 'undefined') {
                debugText.textContent = '❌ Phaser لم يتحمل - تحقق من النت';
                debugText.style.color = '#ff4444';
            } else {
                debugText.textContent = '✓ Phaser ' + Phaser.VERSION + ' loaded - بدء اللعبة...';
                progressBar.style.width = '95%';
            }
        }, 800);

        // Show skip button after 3 sec
        setTimeout(() => {
            skipBtn.style.display = 'block';
            loadingText.textContent = 'تحميل بطيء؟ دوس تخطي';
            debugText.textContent += ' | لو واقف دوس تخطي';
        }, 3000);

        // Auto-hide after 5 sec max
        setTimeout(() => {
            clearInterval(progressInterval);
            if (loadingScreen && loadingScreen.style.display !== 'none') {
                progressBar.style.width = '100%';
                loadingText.textContent = 'جاهز! إخفاء شاشة التحميل...';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        console.log('Loading screen auto-hidden after timeout');
                    }, 800);
                }, 500);
            }
        }, 5000);

        skipBtn.addEventListener('click', () => {
            clearInterval(progressInterval);
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.style.display = 'none', 300);
        });

        window.addEventListener('error', (e) => {
            debugText.textContent = 'خطأ: ' + e.message;
            debugText.style.color = '#ff4444';
            skipBtn.style.display = 'block';
        });
    </script>

    <!-- Bundled game - no external assets -->
    <script src="bundle-mobile.js"></script>
    
    <script>
        // Extra safety: hide loading screen when Phaser game starts
        // This will be called from bundle.js too, but we add extra listener
        setTimeout(() => {
            const checkGame = setInterval(() => {
                const canvas = document.querySelector('#game-container canvas');
                if (canvas) {
                    console.log('Game canvas found, hiding loading screen');
                    clearInterval(checkGame);
                    clearInterval(progressInterval);
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                        setTimeout(() => loadingScreen.style.display = 'none', 500);
                    }, 300);
                }
            }, 500);
            // Stop checking after 10 sec
            setTimeout(() => clearInterval(checkGame), 10000);
        }, 1000);
    </script>
</body>
</html>
